---
# ==============================================================================
# Role: concert_core
# Tasks: Deploys IBM Concert 3.1.x (Core, Protect, Workflows, DataApps) on OpenShift
#        following the official IBM Concert documentation.
# ==============================================================================

- name: Generate random Concert admin password if not provided
  ansible.builtin.set_fact:
    concert_admin_password: "{{ lookup('community.general.random_string', length=16, special=false) }}!A1"
  when: concert_admin_password | length == 0

- name: Create Concert Admin Credentials Secret
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "{{ concert_admin_secret_name }}"
    namespace: "{{ concert_namespace }}"
    state: present
    definition:
      metadata:
        name: "{{ concert_admin_secret_name }}"
        namespace: "{{ concert_namespace }}"
        labels:
          app.kubernetes.io/part-of: ibm-concert
      type: Opaque
      stringData:
        username: "{{ concert_admin_username }}"
        password: "{{ concert_admin_password }}"

- name: Prepare installation temporary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /tmp/bin
    - /tmp/ibm-concert-installer

- name: Check if kubectl exists in PATH
  ansible.builtin.command:
    cmd: which kubectl
  register: kubectl_check
  failed_when: false
  changed_when: false

- name: Download kubectl if missing
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl"
    dest: /tmp/bin/kubectl
    mode: "0755"
  when: kubectl_check.rc != 0

- name: Check if oc exists in PATH
  ansible.builtin.command:
    cmd: which oc
  register: oc_check
  failed_when: false
  changed_when: false

- name: Download and extract oc client if missing
  ansible.builtin.unarchive:
    src: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
    dest: /tmp/bin
    remote_src: true
    mode: "0755"
    extra_opts:
      - oc
  when: oc_check.rc != 0
  ignore_errors: true

- name: Ensure kubectl and oc are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - /tmp/bin/kubectl
    - /tmp/bin/oc
  ignore_errors: true

- name: Check if helm exists in PATH
  ansible.builtin.command:
    cmd: which helm
  register: helm_check
  failed_when: false
  changed_when: false

- name: Download and extract helm if missing
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    mode: "0755"
  when: helm_check.rc != 0
  ignore_errors: true

- name: Move helm binary to /tmp/bin
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /tmp/bin/helm
    mode: "0755"
    remote_src: true
  when: helm_check.rc != 0
  ignore_errors: true

- name: Check if jq exists in PATH
  ansible.builtin.command:
    cmd: which jq
  register: jq_check
  failed_when: false
  changed_when: false

- name: Download jq binary if missing
  ansible.builtin.get_url:
    url: "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64"
    dest: /tmp/bin/jq
    mode: "0755"
  when: jq_check.rc != 0
  ignore_errors: true

- name: Ensure all CLI binaries in /tmp/bin are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - /tmp/bin/kubectl
    - /tmp/bin/oc
    - /tmp/bin/helm
    - /tmp/bin/jq
  ignore_errors: true

- name: Configure In-Cluster Kubeconfig for OpenShift Job environment
  ansible.builtin.shell: |
    if [ -f "/var/run/secrets/kubernetes.io/serviceaccount/token" ]; then
      SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      SA_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      SA_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

      cat <<EOF > /tmp/kubeconfig
    apiVersion: v1
    kind: Config
    clusters:
    - name: in-cluster
      cluster:
        server: https://kubernetes.default.svc
        certificate-authority: ${SA_CA}
    users:
    - name: in-cluster-user
      user:
        token: ${SA_TOKEN}
    contexts:
    - name: in-cluster-context
      context:
        cluster: in-cluster
        user: in-cluster-user
        namespace: ${SA_NS}
    current-context: in-cluster-context
    EOF
      chmod 600 /tmp/kubeconfig
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Set download URL for IBM Concert package
  ansible.builtin.set_fact:
    concert_pkg_url: "https://github.com/IBM/Concert/releases/download/{{ concert_version if concert_version.startswith('v') else ('v' + concert_version) }}/ibm-concert-x86.tar.gz"
    concert_install_dir: "/tmp/ibm-concert-installer/ibm-concert"

- name: Download official IBM Concert release package
  ansible.builtin.get_url:
    url: "{{ concert_pkg_url }}"
    dest: /tmp/ibm-concert-installer/ibm-concert-x86.tar.gz
    mode: "0644"
    timeout: 300

- name: Extract IBM Concert release package
  ansible.builtin.unarchive:
    src: /tmp/ibm-concert-installer/ibm-concert-x86.tar.gz
    dest: /tmp/ibm-concert-installer
    remote_src: true

- name: Ensure setup binaries have execute permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  with_fileglob:
    - "{{ concert_install_dir }}/bin/*"
    - "{{ concert_install_dir }}/concert-hub/bin/*"
    - "{{ concert_install_dir }}/concert-workflows/bin/*"
    - "{{ concert_install_dir }}/dataapps/std/bin/*"
  ignore_errors: true

- name: Extend timeouts in Hub and Keycloak wait scripts for image pulling and database init
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - { path: "{{ concert_install_dir }}/concert-hub/bin/kc-utils", regexp: "local max_attempts=60", replace: "local max_attempts=240" }
    - { path: "{{ concert_install_dir }}/concert-hub/bin/k8s-utils.sh", regexp: "local attempts=10", replace: "local attempts=60" }
    - { path: "{{ concert_install_dir }}/concert-hub/bin/k8s-utils.sh", regexp: "local attempts=20", replace: "local attempts=60" }
  ignore_errors: true

- name: Configure params.ini from official Kubernetes sample
  ansible.builtin.copy:
    src: "{{ concert_install_dir }}/etc/sample-params/concert-dataapps-workflows-k8s-params.ini"
    dest: "{{ concert_install_dir }}/etc/params.ini"
    remote_src: true
    mode: "0644"

- name: Determine workflows instance address
  ansible.builtin.set_fact:
    workflows_address: "solis-gw-ibm-concert-workflows.{{ cluster_ingress_domain }}"

- name: Configure required environment parameters in params.ini
  ansible.builtin.lineinfile:
    path: "{{ concert_install_dir }}/etc/params.ini"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "REG_USER", value: "{{ ibm_entitlement_user }}" }
    - { key: "IMAGE_REGISTRY_PREFIX", value: "cp.icr.io/cp" }
    - { key: "SKIP_DISK_SPACE_CHECK", value: "true" }
    - { key: "SKIP_CPU_MEMORY_CHECK", value: "true" }
    - { key: "LICENSE_ACCEPTANCE", value: "y" }
    - { key: "HUB_NS", value: "{{ hub_namespace }}" }
    - { key: "HUB_IMAGE_REGISTRY_SUFFIX", value: "/platform-hub" }
    - { key: "SCALE_CONFIG_HUB", value: "level_1" }
    - { key: "STORAGE_CLASS_HUB", value: "{{ concert_storage_class_rwo }}" }
    - { key: "INSTALL_CONCERT", value: "{{ 'true' if enable_concert_protect else 'false' }}" }
    - { key: "CONCERT_NS", value: "{{ concert_namespace }}" }
    - { key: "CONCERT_IMAGE_REGISTRY_SUFFIX", value: "/concert" }
    - { key: "SCALE_CONFIG_CONCERT", value: "level_1" }
    - { key: "STORAGE_CLASS_CONCERT", value: "{{ concert_storage_class_rwo }}" }
    - { key: "FILE_STORAGE_CLASS_CONCERT", value: "{{ concert_storage_class_rwx }}" }
    - { key: "ENABLE_BUDDY", value: "true" }
    - { key: "ENABLE_HPA", value: "false" }
    - { key: "INSTALL_DATAAPPS", value: "{{ 'true' if enable_concert_dataapps else 'false' }}" }
    - { key: "DATAAPPS_NS", value: "{{ dataapps_namespace }}" }
    - { key: "DATAAPPS_IMAGE_REGISTRY_SUFFIX", value: "/concert" }
    - { key: "SCALE_CONFIG_DATAAPPS", value: "level_1" }
    - { key: "STORAGE_CLASS_DATAAPPS", value: "{{ concert_storage_class_rwo }}" }
    - { key: "DATAAPPS_ENABLE_HPA", value: "false" }
    - { key: "INSTALL_WORKFLOWS", value: "{{ 'true' if enable_concert_workflows else 'false' }}" }
    - { key: "WORKFLOWS_NS", value: "{{ workflows_namespace }}" }
    - { key: "WORKFLOWS_IMAGE_REGISTRY_SUFFIX", value: "/concert" }
    - { key: "STORAGE_CLASS_WORKFLOWS", value: "{{ concert_storage_class_rwo }}" }
    - { key: "WORKFLOWS_INSTANCE_ADDRESS", value: "{{ workflows_address }}" }

- name: Display installation summary before setup execution
  ansible.builtin.debug:
    msg:
      - "Package: {{ concert_pkg_url }}"
      - "Target Namespace: {{ concert_namespace }}"
      - "StorageClass RWO: {{ concert_storage_class_rwo }}"
      - "StorageClass RWX: {{ concert_storage_class_rwx }}"
      - "Workflows Address: {{ workflows_address }}"
      - "Admin User: {{ concert_admin_username }}"

- name: Execute official IBM Concert setup script
  block:
    - name: Run setup script
      ansible.builtin.command:
        cmd: >-
          {{ concert_install_dir }}/bin/setup
          --license_acceptance=y
          --username={{ concert_admin_username }}
          --password={{ concert_admin_password }}
          --registry_password={{ ibm_entitlement_key }}
        chdir: "{{ concert_install_dir }}"
      environment:
        KUBECONFIG: "{{ '/tmp/kubeconfig' if ('/tmp/kubeconfig' is file) else (lookup('env', 'KUBECONFIG') | default('', true)) }}"
        PATH: "/tmp/bin:/opt/app-root/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:{{ ansible_env.PATH | default(lookup('env', 'PATH')) }}"
        SKIP_CPU_MEMORY_CHECK: "TRUE"
      register: setup_output
      changed_when: true
  rescue:
    - name: Read latest installation log file
      ansible.builtin.shell: |
        LATEST_LOG=$(ls -t {{ concert_install_dir }}/logs/*.log 2>/dev/null | head -n 1)
        if [ -n "$LATEST_LOG" ] && [ -f "$LATEST_LOG" ]; then
          echo "==================== LATEST LOG: $LATEST_LOG ===================="
          tail -n 150 "$LATEST_LOG"
        else
          echo "No log file found under {{ concert_install_dir }}/logs/"
        fi
      register: detailed_log_output
      changed_when: false

    - name: Display detailed failure log output
      ansible.builtin.debug:
        var: detailed_log_output.stdout_lines

    - name: Fail with clear error message
      ansible.builtin.fail:
        msg: "IBM Concert setup failed. Review the detailed log output above."

- name: Wait for IBM Concert Deployments to be Created and Ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ concert_namespace }}"
  register: concert_deployments
  until:
    - concert_deployments.resources is defined
    - concert_deployments.resources | length > 0
    - concert_deployments.resources | selectattr('status.readyReplicas', 'defined') | list | length == concert_deployments.resources | length
  retries: 40
  delay: 30
  ignore_errors: true
