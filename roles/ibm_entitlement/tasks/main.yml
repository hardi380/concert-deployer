---
# ==============================================================================
# Role: ibm_entitlement
# Tasks: Creates and links IBM Container Registry entitlement secrets
# ==============================================================================

- name: Construct Docker auth credentials string
  ansible.builtin.set_fact:
    docker_auth_string: "{{ (ibm_entitlement_user + ':' + ibm_entitlement_key) | b64encode }}"

- name: Construct Docker config JSON
  ansible.builtin.set_fact:
    docker_config_json:
      auths:
        "{{ ibm_registry_host }}":
          username: "{{ ibm_entitlement_user }}"
          password: "{{ ibm_entitlement_key }}"
          email: "{{ ibm_entitlement_email }}"
          auth: "{{ docker_auth_string }}"
        "cp.icr.io/cp/concert":
          username: "{{ ibm_entitlement_user }}"
          password: "{{ ibm_entitlement_key }}"
          email: "{{ ibm_entitlement_email }}"
          auth: "{{ docker_auth_string }}"

- name: Create or update IBM Entitlement Secret in namespaces
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "{{ ibm_registry_secret_name }}"
    namespace: "{{ item }}"
    state: present
    definition:
      metadata:
        name: "{{ ibm_registry_secret_name }}"
        namespace: "{{ item }}"
        labels:
          app.kubernetes.io/part-of: ibm-concert
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ docker_config_json | to_json | b64encode }}"
  loop:
    - "{{ concert_namespace }}"
    - ibm-concert-workflows

- name: Link Entitlement Secret to default ServiceAccounts in namespaces
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: ServiceAccount
    name: "{{ item.1 }}"
    namespace: "{{ item.0 }}"
    definition:
      imagePullSecrets:
        - name: "{{ ibm_registry_secret_name }}"
  with_nested:
    - ["{{ concert_namespace }}", "ibm-concert-workflows"]
    - ["default", "builder", "deployer", "ibm-concert-sa"]
  ignore_errors: true
